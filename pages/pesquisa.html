<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pesquisa histórias, poemas, memes, status e pensamentos no StoryVerse." data-i18n-content="desc.search">
  <meta name="theme-color" content="#111936">
  <title data-i18n="page.search">Pesquisa — StoryVerse</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo/icone.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/status-page.css">
  <link rel="stylesheet" href="../css/stories.css">
  <link rel="stylesheet" href="../css/search-page.css">
</head>
<body>
  <a class="skip-link" href="#search-content" data-i18n="skip">Saltar para o conteúdo</a>
  <script src="../js/modules/layout.js" data-part="header"></script>

  <main id="search-content" class="status-page">
    <section class="status-hero">
      <div class="container status-hero-inner">
        <div class="status-hero-copy">
          <div class="status-hero-icon"><i data-lucide="search"></i></div>
          <div>
            <p class="status-eyebrow" data-i18n="search.eyebrow">STORYVERSE · PESQUISA</p>
            <h1 data-i18n="soon.search">Pesquisa</h1>
            <p data-i18n="search.pageSub">Encontra histórias, poemas, memes, status e pensamentos pelo título ou pelo texto.</p>
          </div>
        </div>
      </div>
    </section>

    <section class="container status-library" aria-labelledby="search-results-title">
      <form class="sp-form" id="sp-form" role="search">
        <label class="status-search sp-input">
          <i data-lucide="search"></i>
          <span class="sr-only" data-i18n="search.label">Pesquisar</span>
          <input id="sp-q" type="search" name="q" autocomplete="off" placeholder="Pesquisar conteúdos..." data-i18n-placeholder="search.hero">
        </label>
        <button type="submit" class="status-create-btn" data-i18n="search.label">Pesquisar</button>
      </form>
      <h2 id="search-results-title" class="sp-count" aria-live="polite"></h2>
      <div id="sp-results" class="sp-results"></div>
      <p id="sp-none" class="status-empty" hidden></p>
    </section>
  </main>

  <script src="../js/modules/layout.js" data-part="footer"></script>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
  <script src="../js/data/config.js" defer></script>
  <script src="../js/data/languages.js" defer></script>
  <script src="../js/data/contents.js" defer></script>
  <script src="../js/modules/language.js" defer></script>
  <script src="../js/modules/navigation.js" defer></script>
  <script src="../js/modules/feedback.js" defer></script>
  <script src="../js/modules/search.js" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/modules/story-core.js" defer></script>
  <script src="../js/modules/search-page.js" defer></script>
</body>
</html>
