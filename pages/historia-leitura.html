<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lê uma história do StoryVerse." data-i18n-content="desc.readStory">
  <meta name="theme-color" content="#111936">
  <title data-i18n="page.readStory">Ler história — StoryVerse</title>
  <link rel="icon" href="../assets/logo/favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/logo/favicon-192.png?v=2">
  <link rel="apple-touch-icon" href="../assets/logo/apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/stories.css">
</head>
<body>
  <a class="skip-link" href="#reader-main" data-i18n="skip">Saltar para o conteúdo</a>
  <script src="../js/modules/layout.js" data-part="header"></script>

  <main id="reader-main" class="container reader-page">
    <div class="reader-top">
      <a class="reader-back" id="reader-back" href="historias.html"><i data-lucide="arrow-left"></i><span data-i18n="reader.back">Voltar às histórias</span></a>
      <div class="reader-top-actions">
        <button type="button" class="reader-btn" id="reader-settings-toggle" aria-expanded="false" aria-controls="reader-settings"><i data-lucide="settings-2"></i><span data-i18n="reader.settings">Leitura</span></button>
        <a class="reader-btn reader-btn-main" id="reader-edit" href="editor-historia.html"><i data-lucide="pencil"></i><span data-i18n="reader.edit">Editar esta história</span></a>
      </div>
    </div>

    <section class="reader-settings" id="reader-settings" hidden aria-label="Leitura" data-i18n-aria-label="reader.settings">
      <div class="reader-set"><label for="rs-size" data-i18n="reader.size">Tamanho do texto</label><input type="range" id="rs-size" min="15" max="28" step="1" value="18"><output id="rs-size-out">18</output></div>
      <div class="reader-set"><label for="rs-lh" data-i18n="reader.lh">Espaço entre linhas</label><input type="range" id="rs-lh" min="1.4" max="2.4" step="0.1" value="1.8"><output id="rs-lh-out">1.8</output></div>
      <div class="reader-set"><span data-i18n="reader.font">Tipo de letra</span>
        <div class="seg" role="group"><button type="button" class="seg-btn is-selected" data-font="serif" aria-pressed="true" data-i18n="reader.serif">Com serifa</button><button type="button" class="seg-btn" data-font="sans" aria-pressed="false" data-i18n="reader.sans">Sem serifa</button></div></div>
      <div class="reader-set"><span data-i18n="reader.theme">Tema</span>
        <div class="seg" role="group"><button type="button" class="seg-btn is-selected" data-theme-r="light" aria-pressed="true" data-i18n="reader.light">Claro</button><button type="button" class="seg-btn" data-theme-r="dark" aria-pressed="false" data-i18n="reader.dark">Escuro</button><button type="button" class="seg-btn" data-theme-r="sepia" aria-pressed="false" data-i18n="reader.sepia">Sépia</button></div></div>
    </section>

    <article id="reader" class="reader theme-light font-serif" aria-live="polite"></article>
  </main>

  <script src="../js/modules/layout.js" data-part="footer"></script>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
  <script src="../js/data/config.js" defer></script>
  <script src="../js/data/languages.js" defer></script>
  <script src="../js/data/contents.js" defer></script>
  <script src="../js/modules/language.js" defer></script>
  <script src="../js/modules/navigation.js" defer></script>
  <script src="../js/modules/feedback.js" defer></script>
  <script src="../js/modules/search.js" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/modules/story-core.js" defer></script>
  <script src="../js/modules/story-reader.js" defer></script>
</body>
</html>
